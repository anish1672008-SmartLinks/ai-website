<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hindi AI Chat</title>

  <style>
    body {
      background: #0b0f1a;
      color: white;
      font-family: Arial, sans-serif;
      padding: 30px;
    }

    h2 {
      color: #00ffe1;
      text-shadow: 0 0 10px #00ffe1;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 15px;
      font-size: 16px;
      border-radius: 10px;
      border: 2px solid #00ffe1;
      background: #11162a;
      color: white;
      outline: none;
      resize: vertical;
      box-shadow: 0 0 15px rgba(0,255,225,0.4);
    }

    .neon-btn {
      margin-top: 10px;
      padding: 10px 18px;
      font-size: 15px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: #00ffe1;
      color: #000;
      box-shadow: 0 0 12px #00ffe1;
      transition: 0.3s;
    }

    .neon-btn:hover {
      box-shadow: 0 0 25px #00ffe1, 0 0 50px #00ffe1;
      transform: scale(1.05);
    }

    select.neon-btn {
      background: #11162a;
      color: white;
      border: 2px solid #00ffe1;
    }

    #reply {
      margin-top: 20px;
      padding: 15px;
      background: #11162a;
      border-left: 4px solid #00ffe1;
      box-shadow: 0 0 10px rgba(0,255,225,0.3);
      min-height: 40px;
    }
  </style>
</head>

<body>

  <h2>🤖 Hindi AI Chat</h2>

  <!-- Language Selector -->
  <select id="languageSelect" class="neon-btn" onchange="changeLanguage()">
    <option value="hindi">Hindi</option>
    <option value="english">English</option>
  </select>

  <br><br>

  <textarea id="msg" placeholder="Type your message here..."></textarea>

  <br>

  <button class="neon-btn" onclick="send()">🚀 Send</button>
  <button class="neon-btn" onclick="voice()">🎤 Mic</button>

  <p id="modeText">Current Mode: Hindi AI</p>

  <div id="reply"></div>

  <script src="/static/js/chat.js"></script>
  <script src="/static/js/theme.js"></script>

  <!-- MAIN LOGIC -->
  <script>
    let currentMode = "hindi";

    function changeLanguage() {
      currentMode = document.getElementById("languageSelect").value;
      document.getElementById("modeText").innerText =
        "Current Mode: " + (currentMode === "english" ? "English AI" : "Hindi AI");
    }

    function send() {
      const msg = document.getElementById("msg").value;
      if (!msg.trim()) return;

      fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          message: msg,
          mode: currentMode
        })
      })
      .then(res => res.json())
      .then(data => {
        document.getElementById("reply").innerText = data.reply;
      });

      document.getElementById("msg").value = "";
    }

    function voice() {
      alert("🎤 Voice feature coming soon!");
    }
  </script>

</body>
</html>
